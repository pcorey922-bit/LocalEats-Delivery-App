name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rocoeats
          POSTGRES_PASSWORD: rocoeats_test_only
          POSTGRES_DB: rocoeats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rocoeats -d rocoeats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rocoeats:rocoeats_test_only@localhost:5432/rocoeats_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
