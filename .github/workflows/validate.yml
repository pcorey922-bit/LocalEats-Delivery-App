name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rocoeats
          POSTGRES_PASSWORD: rocoeats_test_only
          POSTGRES_DB: rocoeats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rocoeats -d rocoeats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rocoeats:rocoeats_test_only@localhost:5432/rocoeats_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - name: Validate secure staging configuration preflight
        run: node --test scripts/verify-staging-http.test.mjs scripts/check-staging-environment.test.mjs scripts/container-environment.test.mjs scripts/free-staging.test.mjs scripts/retry-native-dependencies.test.mjs scripts/prepare-native-staging.test.mjs scripts/install-native-gradle.test.mjs
      - name: Validate staging Compose configuration with test placeholders
        env:
          ROCOEATS_DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CLERK_PUBLISHABLE_KEY: pk_test_qa
          CLERK_SECRET_KEY: sk_test_qa
          LOCALEATS_ADMIN_CLERK_USER_IDS: user_QAOwner
          STRIPE_SECRET_KEY: sk_test_qa
          STRIPE_WEBHOOK_SECRET: whsec_qa
          PUBLIC_APP_URL: http://localhost:3001
          CORS_ORIGINS: http://localhost:3001
        run: docker compose --env-file /dev/null -f compose.staging.yml config --quiet
      - name: Verify pinned owner-review delivery map
        run: |
          node scripts/build-delivery-area-review.mjs
          git diff --exit-code -- docs/delivery-area/index.html docs/delivery-area/rockwood-proposal.svg
      - run: pnpm test
      - name: Rehearse PostgreSQL backup and restore with ledger guards
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGUSER: rocoeats
          PGPASSWORD: rocoeats_test_only
        run: bash scripts/verify-postgres-recovery.sh
      - run: pnpm build
      - name: Verify mobile-width signup and account flows with simulated Clerk
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/rocoeats-browser" --no-save --ignore-scripts playwright-core@1.62.1
          PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/rocoeats-browser/node_modules/playwright-core" \
            CHROMIUM_PATH="$(command -v google-chrome)" \
            node scripts/verify-account-browser.mjs
      - name: Verify website order through delivery and ledger with local payment simulator
        timeout-minutes: 5
        run: |
          PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/rocoeats-browser/node_modules/playwright-core" \
            CHROMIUM_PATH="$(command -v google-chrome)" \
            node scripts/verify-website-workflow.mjs
      - name: Build deployable website and API container
        run: docker build --tag rocoeats:ci .
      - name: Verify packaged migrations as non-root without pnpm on PATH
        run: |
          docker exec ${{ job.services.postgres.id }} createdb --username=rocoeats rocoeats_container_migration
          migration_url="postgresql://rocoeats:rocoeats_test_only@localhost:5432/rocoeats_container_migration"
          docker run --rm --network host --env DATABASE_URL="$migration_url" --env PATH=/nonexistent --entrypoint /usr/local/bin/node rocoeats:ci --input-type=module -e "import assert from 'node:assert/strict'; import {migrateFreeStaging} from './scripts/free-staging.mjs'; assert.equal(process.getuid(),1000); await migrateFreeStaging(process.env);"
          docker exec ${{ job.services.postgres.id }} psql --username=rocoeats --dbname=rocoeats_container_migration --command="INSERT INTO profiles (clerk_user_id, display_name, role) VALUES ('user_ContainerQA', 'Container migration QA', 'customer')"
          docker run --rm --network host --env DATABASE_URL="$migration_url" --env PATH=/nonexistent --entrypoint /usr/local/bin/node rocoeats:ci --input-type=module -e "import {migrateFreeStaging,Client} from './scripts/free-staging.mjs'; import assert from 'node:assert/strict'; await migrateFreeStaging(process.env); const client=new Client({connectionString:process.env.DATABASE_URL}); await client.connect(); const result=await client.query('SELECT display_name FROM profiles WHERE clerk_user_id=\$1',['user_ContainerQA']); assert.equal(result.rows[0].display_name,'Container migration QA'); await client.end();"
      - name: Verify container startup, website routes and dependency readiness
        run: |
          docker run --detach --network host --name rocoeats-ci --env DATABASE_URL="$TEST_DATABASE_URL" --env PORT=3001 rocoeats:ci
          trap 'docker logs rocoeats-ci; docker rm --force rocoeats-ci' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://localhost:3001/livez
          curl --fail http://localhost:3001/ | grep -q RoCoEats
          curl --fail http://localhost:3001/orders | grep -q RoCoEats
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3001/readyz)" = 503
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3001/.env)" = 404
      - uses: actions/upload-artifact@v4
        with:
          name: RoCoEats-web-and-api-unconfigured
          path: |
            artifacts/localeats/dist/public/
            artifacts/api-server/dist/
