name: Native validation and signed staging
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Compile only, create staging APK, or initialize owner signing
        type: choice
        options: [compile, staging, initialize-staging-signing, android-smoke]
        default: compile
      apk_run:
        description: Successful signed staging APK run to test (android-smoke only)
        type: string
        default: "42583769896"
permissions:
  contents: read
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'compile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages with the runner's current tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/localeats mobile:sync
      - name: Install checksum-pinned official Gradle
        run: node scripts/install-native-gradle.mjs
      - name: Resolve Gradle dependencies with bounded transport retries
        run: bash ../../../scripts/retry-native-dependencies.sh "$ROCOEATS_GRADLE_BINARY" -I ../../../scripts/resolve-native-dependencies.gradle prefetchRoCoEatsDependencies --no-daemon
        working-directory: artifacts/localeats/android
      - run: |
          "$ROCOEATS_GRADLE_BINARY" assembleDebug --no-daemon
        working-directory: artifacts/localeats/android
      - name: Validate unsigned release APK and Android App Bundle
        run: |
          "$ROCOEATS_GRADLE_BINARY" assembleRelease bundleRelease lintRelease --no-daemon
        working-directory: artifacts/localeats/android
      - name: Validate staging variant without packaging an install artifact
        run: |
          "$ROCOEATS_GRADLE_BINARY" assembleStaging lintStaging --no-daemon
        working-directory: artifacts/localeats/android
      - uses: actions/upload-artifact@v4
        with:
          name: RoCoEats-Android-release-unsigned-unconfigured
          path: |
            artifacts/localeats/android/app/build/outputs/apk/release/app-release-unsigned.apk
            artifacts/localeats/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: RoCoEats-Android-debug-unconfigured
          path: artifacts/localeats/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'compile'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/localeats mobile:sync
      - name: Resolve iOS packages with bounded transport retries
        run: bash ../../../scripts/retry-native-dependencies.sh xcodebuild -resolvePackageDependencies -project App/App.xcodeproj -scheme App -clonedSourcePackagesDirPath "$RUNNER_TEMP/rocoeats-ios-packages"
        working-directory: artifacts/localeats/ios
      - run: xcodebuild -project App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -clonedSourcePackagesDirPath "$RUNNER_TEMP/rocoeats-ios-packages" -disableAutomaticPackageResolution -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: artifacts/localeats/ios
      - run: ditto -c -k --keepParent artifacts/localeats/ios/build/Build/Products/Debug-iphonesimulator/App.app "$RUNNER_TEMP/RoCoEats-iOS-simulator.zip"
      - name: Validate unsigned iOS device release compilation
        run: xcodebuild -project App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath "$RUNNER_TEMP/rocoeats-ios-packages" -disableAutomaticPackageResolution -derivedDataPath release-build CODE_SIGNING_ALLOWED=NO build
        working-directory: artifacts/localeats/ios
      - run: ditto -c -k --keepParent artifacts/localeats/ios/release-build/Build/Products/Release-iphoneos/App.app "$RUNNER_TEMP/RoCoEats-iOS-release-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RoCoEats-iOS-release-unsigned-unconfigured
          path: ${{ runner.temp }}/RoCoEats-iOS-release-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RoCoEats-iOS-simulator-unconfigured
          path: ${{ runner.temp }}/RoCoEats-iOS-simulator.zip

  initialize-staging-signing:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'initialize-staging-signing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create stable owner-controlled test identity in repository secrets
        env:
          GH_TOKEN: ${{ secrets.ROCOEATS_SIGNING_SETUP_TOKEN }}
        run: bash .github/scripts/bootstrap-staging-signing.sh
  android-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Require owner-managed signing before installing dependencies
        env:
          KEYSTORE: ${{ secrets.ROCOEATS_STAGING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ROCOEATS_STAGING_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" || { echo 'Owner signing setup is required. See docs/ANDROID_STAGING_TEST.md'; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node scripts/prepare-native-staging.mjs --github-env
      - name: Require deployed safe native backend before packaging
        run: node scripts/verify-native-staging.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/localeats mobile:sync
      - name: Restore signing key only into private runner temporary storage
        env:
          KEYSTORE: ${{ secrets.ROCOEATS_STAGING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/rocoeats-staging.p12"
      - name: Install current Android SDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install checksum-pinned official Gradle
        run: node scripts/install-native-gradle.mjs
      - name: Resolve official Gradle dependencies
        run: bash ../../../scripts/retry-native-dependencies.sh "$ROCOEATS_GRADLE_BINARY" -I ../../../scripts/resolve-native-dependencies.gradle prefetchRoCoEatsDependencies --no-daemon
        working-directory: artifacts/localeats/android
      - name: Build signed non-debuggable staging APK
        env:
          ROCOEATS_STAGING_KEYSTORE_PATH: ${{ runner.temp }}/rocoeats-staging.p12
          ROCOEATS_STAGING_KEYSTORE_PASSWORD: ${{ secrets.ROCOEATS_STAGING_KEYSTORE_PASSWORD }}
          ROCOEATS_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          "$ROCOEATS_GRADLE_BINARY" assembleStaging lintStaging --no-daemon
        working-directory: artifacts/localeats/android
      - name: Verify signature, package, permissions and absence of packaged server credentials
        env:
          ROCOEATS_STAGING_KEYSTORE_PASSWORD: ${{ secrets.ROCOEATS_STAGING_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p staging-apk
          cp artifacts/localeats/android/app/build/outputs/apk/staging/app-staging.apk staging-apk/RoCoEats-Android-Staging-Test.apk
          python3 scripts/verify-staging-apk.py staging-apk/RoCoEats-Android-Staging-Test.apk "$ANDROID_HOME/build-tools/36.0.0" staging-apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoCoEats-Android-Staging-Test-APK
          path: staging-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rocoeats-staging.p12"

  android-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'android-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate the selected successful artifact source
        env:
          APK_RUN: ${{ inputs.apk_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$APK_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN" --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: RoCoEats-Android-Staging-Test-APK
          path: smoke-input
          run-id: ${{ inputs.apk_run }}
          github-token: ${{ github.token }}
      - name: Install official Android emulator tooling
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'
      - name: Verify the original APK digest and owner signature
        run: |
          (cd smoke-input && sha256sum -c SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs smoke-input/RoCoEats-Android-Staging-Test.apk > "$RUNNER_TEMP/rocoeats-apk-cert.txt"
          grep -q 'certificate SHA-256 digest: f22e58f4da4e5d64f9ac5d4f0fc8abfe2595e395511552f7fb385205c7d18296' "$RUNNER_TEMP/rocoeats-apk-cert.txt"
      - name: Allow this isolated runner access to its virtualization device
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Install and exercise the actual signed APK on Android 15 emulator
        run: bash scripts/start-android-qa-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RoCoEats-Android-Emulator-QA
          path: android-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
